<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alvarado Creek Data Visualizations</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0b2d4d, #1479a8);
      color: white;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2.4rem;
    }

    .subtitle {
      margin-bottom: 35px;
      color: #d9f3ff;
      font-size: 1.1rem;
    }

    .visualizations {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 25px;
    }

    .card {
      background: white;
      color: #183b56;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .card h2 {
      margin-top: 0;
      color: #0b5278;
    }

    iframe {
      width: 100%;
      height: 360px;
      border: 1px solid #c5dce8;
      border-radius: 8px;
      background: white;
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 11px 18px;
      background: #087ca7;
      color: white;
      text-decoration: none;
      border-radius: 7px;
      font-weight: bold;
    }

    .button:hover {
      background: #05516f;
    }

    .footer {
      margin-top: 35px;
      color: #d9f3ff;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>Alvarado Creek Data Visualizations</h1>

    <p class="subtitle">
      Interactive stream cross-section and field measurement data
    </p>

    <div class="visualizations">

      <div class="card">
        <h2>Animated Flow Chart</h2>

        <iframe
          src="alvarado_creek_3d_flow.html"
          title="Animated Alvarado Creek flow chart">
        </iframe>

        <a
          class="button"
          href="alvarado_creek_3d_flow.html"
          target="_blank">
          Open Full Chart
        </a>
      </div>

      <div class="card">
        <h2>Data Table</h2>

        <iframe
          src="alvarado_creek_data_table.html"
          title="Alvarado Creek data table">
        </iframe>

        <a
          class="button"
          href="alvarado_creek_data_table.html"
          target="_blank">
          Open Full Table
        </a>
      </div>

    </div>

    <p class="footer">
      Data collected during field sampling at Alvarado Creek.
    </p>

  </div>
</body>
</html>
